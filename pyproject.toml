[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpaybench"
version = "0.4.0"
description = "A 20-scenario robustness benchmark for agent payment / entitlement APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentPayBench contributors" }]
keywords = ["agent", "payments", "benchmark", "idempotency", "webhook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
agentpaybench = "runner:main"
agentpaybench-selftest = "selftest:main"
agentpaybench-check = "check_service:main"

[tool.setuptools]
py-modules = [
  "agents",
  "all_selftest",
  "client",
  "client_guard",
  "client_guard_selftest",
  "check_service",
  "check_service_selftest",
  "fuzz_invariants",
  "injection_matrix",
  "mock_server",
  "openapi_conformance",
  "rate_limit_selftest",
  "runner",
  "scenarios",
  "selftest",
  "stress",
  "webhook_e2e",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
