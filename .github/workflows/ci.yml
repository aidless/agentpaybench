name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff build
      - name: Lint
        run: ruff check .
      - name: Build wheel
        run: python -m build --wheel
      - name: All 29 checks (hardened + naive mutation proof)
        run: python all_selftest.py
      - name: Official OpenAPI 1.1.2 conformance
        run: python openapi_conformance.py
      - name: Invariant fuzz (quick)
        run: |
          python fuzz_invariants.py --steps 1000
          python fuzz_invariants.py --mode naive --steps 500
      - name: Concurrency stress
        run: python stress.py --threads 50
      - name: Runner report
        run: python runner.py --json /tmp/report.json

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch official SDK
        run: |
          npm pack opcpay@0.3.5
          tar -xzf opcpay-0.3.5.tgz
      - name: SDK conformance
        run: make sdk OPCPAY_SDK="$PWD/package/index.mjs"
